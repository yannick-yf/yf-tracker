<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1115">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>YF Tracker</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f1115;
            --surface: #171a21;
            --line: #303642;
            --text: #e6e9ef;
            --muted: #a4acbb;
            --accent: #8492ff;
            --action: #4c5bd4;
            --green: #72d6af;
            --amber: #e9bd72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            letter-spacing: 0;
        }

        button,
        input,
        select {
            font: inherit;
            letter-spacing: 0;
        }

        button {
            touch-action: manipulation;
            cursor: pointer;
            color: inherit;
        }

        button:disabled {
            cursor: default;
            opacity: .5;
        }

        input,
        select {
            width: 100%;
            min-height: 44px;
            font-size: 16px;
            touch-action: manipulation;
            background: #11141a;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 9px 10px;
            caret-color: var(--accent);
        }

        input::placeholder {
            color: #9ba4b5;
            opacity: 1;
        }

        input:disabled {
            opacity: .75;
        }

        input[aria-invalid="true"] {
            border-color: #e89191;
        }

        input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        input::-webkit-inner-spin-button {
            appearance: none;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        ::selection {
            background: #4c5bd4;
            color: white;
        }

        * {
            scrollbar-color: #50596b var(--bg);
            scrollbar-width: thin;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            font-size: 24px;
            font-weight: 750;
            line-height: 1.2;
        }

        h2 {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.35;
        }

        h3 {
            font-size: 15px;
            font-weight: 650;
        }

        .muted {
            color: var(--muted);
        }

        .small {
            font-size: 12px;
        }

        .icon {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: transparent;
            flex-shrink: 0;
        }

        .icon-button:hover {
            background: #252b36;
        }

        .icon-button.active {
            background: #173b30;
            border-color: #4b9e7d;
            color: var(--green);
        }

        .command {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            border: 1px solid #6877ec;
            border-radius: 6px;
            padding: 10px 16px;
            background: var(--action);
            color: white;
            font-weight: 650;
        }

        .command:hover {
            background: #5969e5;
        }

        .command.secondary {
            background: transparent;
            border-color: var(--line);
            color: var(--text);
        }

        .page-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid #262b35;
        }

        .header-inner {
            max-width: 800px;
            margin: auto;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand {
            width: 38px;
            height: 38px;
            border-radius: 8px;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 750;
        }

        .update-bar {
            position: fixed;
            left: 12px;
            right: 12px;
            top: calc(env(safe-area-inset-top) + 8px);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 12px;
        }

        .update-bar[hidden] {
            display: none;
        }

        .update-bar span {
            flex: 1;
        }

        .concept {
            margin-left: auto;
            color: var(--muted);
            text-align: right;
            font-size: 12px;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 20px 18px 170px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        label.field {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .workout-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .workout-heading .muted {
            margin-top: 5px;
            font-size: 13px;
        }

        .group-heading {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 650;
            color: var(--muted);
            margin: 23px 0 10px;
        }

        .group-heading::after {
            content: "";
            flex: 1;
            border-top: 1px solid #262c36;
        }

        .pair-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .pair-tabs button {
            min-height: 44px;
            min-width: 0;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .pair-tabs button[aria-selected="true"] {
            background: #232838;
            color: var(--text);
            border-color: var(--accent);
        }

        .guidance {
            font-size: 12px;
            color: var(--muted);
            margin: 0 0 12px;
        }

        .availability {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .availability .text-command {
            text-align: left;
        }

        .exercise {
            padding: 15px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            margin-bottom: 12px;
        }

        .exercise-heading {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .exercise-name {
            flex: 1;
            min-width: 0;
        }

        .target {
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .exercise-tools {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .equipment-line {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
            margin: 13px 0 8px;
        }

        .equipment-line .icon {
            width: 15px;
            height: 15px;
        }

        .convention-warning {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 8px 0;
            color: var(--amber);
            font-size: 12px;
        }

        .text-command {
            min-height: 44px;
            background: transparent;
            border: 0;
            padding: 6px 0;
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .reference {
            display: flex;
            gap: 12px;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            border-top: 1px solid #292f3a;
            border-bottom: 1px solid #292f3a;
            margin-bottom: 12px;
        }

        .reference-values {
            font-size: 14px;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .reference-meta {
            color: var(--muted);
            font-size: 11px;
            text-align: right;
            flex-shrink: 0;
        }

        .elsewhere {
            color: var(--muted);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            overflow-wrap: anywhere;
            margin: -4px 0 12px;
        }

        .empty-reference {
            color: var(--amber);
            font-size: 13px;
        }

        .set-head,
        .set-row {
            display: grid;
            grid-template-columns: 24px minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, .8fr) 44px;
            gap: 7px;
            align-items: center;
        }

        .set-head {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 5px;
            text-align: center;
        }

        .set-row {
            margin-top: 7px;
            font-variant-numeric: tabular-nums;
        }

        .set-row input {
            text-align: center;
            padding: 8px 4px;
            min-width: 0;
        }

        .set-number {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        .set-row .icon-button {
            border-color: #424b5c;
        }

        .set-actions {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .set-actions button {
            color: var(--muted);
        }

        .row-error {
            color: #f0a1a1;
            font-size: 12px;
            min-height: 0;
            margin-top: 6px;
        }

        .row-error:empty {
            display: none;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg);
            border-top: 1px solid var(--line);
            z-index: 15;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .bottom-inner {
            max-width: 800px;
            margin: auto;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .bottom-info {
            flex: 1;
            min-width: 0;
        }

        .done-count {
            font-size: 14px;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .rest-row {
            max-width: 764px;
            margin: 0 auto;
            padding: 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rest-row[hidden] {
            display: none;
        }

        .rest-time {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 54px;
        }

        .rest-label {
            flex: 1;
            font-size: 12px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        dialog {
            padding: 0;
            border: 1px solid #424b5c;
            border-bottom: 0;
            border-radius: 8px 8px 0 0;
            color: var(--text);
            background: var(--surface);
            max-width: 760px;
            width: calc(100% - 24px);
            max-height: 86dvh;
            margin: auto auto 0;
            box-shadow: 0 12px 36px #0008;
        }

        dialog::backdrop {
            background: #000b;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 18px;
            border-bottom: 1px solid var(--line);
        }

        .sheet-header h2 {
            flex: 1;
        }

        .sheet-body {
            padding: 18px;
            overflow-y: auto;
            max-height: calc(86dvh - 75px);
        }

        .sheet-subtitle {
            color: var(--muted);
            font-size: 13px;
            margin: 5px 0 18px;
        }

        .sheet-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .sheet-section {
            margin-top: 22px;
        }

        .sheet-section h3 {
            margin-bottom: 10px;
        }

        .history-list {
            margin-top: 12px;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .history-row .muted {
            min-width: 60px;
        }

        .history-row span:last-child {
            text-align: right;
        }

        .context-item {
            padding: 12px 0;
            border-top: 1px solid var(--line);
        }

        .context-item strong {
            font-size: 13px;
        }

        .context-item p {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .context-label {
            color: var(--amber);
            font-size: 11px;
            font-weight: 500;
        }

        .chart-title {
            margin: 18px 0 4px;
            font-size: 12px;
            color: var(--muted);
        }

        canvas {
            display: block;
            width: 100%;
            height: 140px;
        }

        .equipment-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
        }

        .equipment-option input {
            appearance: auto;
            width: 19px;
            min-height: 19px;
            height: 19px;
            margin: 3px 0 0;
            flex-shrink: 0;
            accent-color: var(--accent);
        }

        .equipment-option strong {
            display: block;
            font-size: 14px;
        }

        .equipment-option span {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
        }

        .new-equipment-fields {
            margin-top: 16px;
            display: grid;
            gap: 12px;
        }

        .new-equipment-fields[hidden] {
            display: none;
        }

        .sheet-message {
            font-size: 14px;
            line-height: 1.6;
            color: #cbd1dc;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 150px;
            transform: translateX(-50%);
            z-index: 30;
            background: #263149;
            border: 1px solid #5a6e9f;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 13px;
            width: max-content;
            max-width: calc(100% - 32px);
            text-align: center;
        }

        #toast[hidden] {
            display: none;
        }

        .screen-reader {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        @media(max-width:440px) {
            .header-inner {
                padding: 10px 12px;
            }

            main {
                padding: 16px 12px 170px;
            }

            .concept {
                font-size: 11px;
            }

            .controls {
                gap: 9px;
                margin-bottom: 20px;
            }

            select {
                padding-left: 8px;
            }

            h1 {
                font-size: 22px;
            }

            .exercise {
                padding: 12px;
            }

            .exercise-tools {
                gap: 4px;
            }

            .reference {
                align-items: flex-start;
            }

            .reference-values {
                font-size: 13px;
            }

            .bottom-inner {
                padding: 12px;
                gap: 10px;
            }

            .bottom-inner .command {
                padding: 10px 12px;
                font-size: 14px;
            }

            .rest-row {
                padding: 10px 12px 0;
            }

            dialog {
                width: 100%;
            }
        }

        @media(prefers-reduced-motion:no-preference) {
            dialog[open] {
                animation: sheet-in .18s ease-out;
            }

            @keyframes sheet-in {
                from {
                    transform: translateY(16px);
                }

                to {
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
        <defs>
            <symbol id="i-history" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5M12 7v5l4 2" />
            </symbol>
            <symbol id="i-settings" viewBox="0 0 24 24">
                <path d="M21 4H14M10 4H3M21 12H12M8 12H3M21 20H16M12 20H3M14 2v4M8 10v4M16 18v4" />
            </symbol>
            <symbol id="i-check" viewBox="0 0 24 24">
                <path d="m9 12 2 2 4-4" />
                <circle cx="12" cy="12" r="10" />
            </symbol>
            <symbol id="i-plus" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
            </symbol>
            <symbol id="i-minus" viewBox="0 0 24 24">
                <path d="M5 12h14" />
            </symbol>
            <symbol id="i-close" viewBox="0 0 24 24">
                <path d="m18 6-12 12M6 6l12 12" />
            </symbol>
            <symbol id="i-pin" viewBox="0 0 24 24">
                <path
                    d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" />
                <circle cx="12" cy="10" r="3" />
            </symbol>
            <symbol id="i-pause" viewBox="0 0 24 24">
                <rect x="6" y="3" width="4" height="18" rx="1" />
                <rect x="14" y="3" width="4" height="18" rx="1" />
            </symbol>
            <symbol id="i-play" viewBox="0 0 24 24">
                <path d="m9 5 12 7-12 7V5" />
            </symbol>
            <symbol id="i-reset" viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5" />
            </symbol>
            <symbol id="i-link" viewBox="0 0 24 24">
                <path
                    d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </symbol>
        </defs>
    </svg>
    <header class="page-header">
        <div class="header-inner">
            <img class="brand" src="icon-192.png" width="38" height="38" alt="YF">
            <div>
                <div class="brand-name">YF Tracker</div>
                <div class="small muted">Train</div>
            </div>
            <div class="concept" id="review-mode">v2.2</div>
            <button class="command secondary" data-action="backups" id="backup-button" title="Backups and restore"
                aria-label="Backups and restore">Backup</button>
        </div>
    </header>
    <div class="update-bar" id="update-bar" hidden><span>New version ready.</span><button class="command" data-action="reload-app">Reload</button></div>
    <main>
        <div class="controls">
            <div><label class="field" for="session">Workout</label><select id="session">
                    <option value="upper-a">Upper A</option>
                    <option value="lower-a">Lower A</option>
                    <option value="upper-b">Upper B</option>
                    <option value="upper-c">Upper C</option>
                    <option value="lower-b">Lower B</option>
                </select></div>
            <div><label class="field" for="venue">Venue</label><select id="venue">
                    <option value="ttl">ToTheLimitGym</option>
                    <option value="bf">Basic Fit</option>
                    <option value="home">Home</option>
                    <option value="hotel">Hotel</option>
                    <option value="other">Other</option>
                </select></div>
        </div>
        <div class="controls">
            <div><label class="field" for="workout-date">Workout date</label><input id="workout-date" type="date"></div>
            <div><label class="field">Local save</label>
                <p class="small muted" id="save-status" role="status">Opening storage</p>
            </div>
        </div>
        <input type="file" id="backup-file" accept="application/json,.json" hidden>
        <div class="workout-heading">
            <div>
                <h1 id="workout-title">Upper A</h1>
                <p class="muted" id="workout-subtitle"></p>
            </div>
        </div>
        <div id="exercise-list"></div>
    </main>
    <footer class="bottom-bar">
        <div class="rest-row" id="rest-row" hidden><span class="rest-time" id="rest-time">2:30</span><span
                class="rest-label" id="rest-label"></span><button class="icon-button" data-action="pause-timer"
                id="pause-timer" title="Pause rest timer" aria-label="Pause rest timer"><svg class="icon">
                    <use href="#i-pause" />
                </svg></button><button class="icon-button" data-action="close-timer" title="Dismiss rest timer"
                aria-label="Dismiss rest timer"><svg class="icon">
                    <use href="#i-close" />
                </svg></button></div>
        <div class="bottom-inner">
            <div class="bottom-info">
                <div class="done-count" id="done-count">0 sets completed</div>
                <div class="small muted" id="draft-status">ToTheLimitGym draft</div>
            </div><button class="command" data-action="finish"><svg class="icon">
                    <use href="#i-check" />
                </svg>Finish workout</button>
        </div>
    </footer>
    <dialog id="sheet" aria-labelledby="sheet-title">
        <div class="sheet-header">
            <h2 id="sheet-title"></h2><button class="icon-button" data-action="close-sheet" title="Close"
                aria-label="Close"><svg class="icon">
                    <use href="#i-close" />
                </svg></button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <script src="review-store.js"></script>
    <script>
        'use strict';
        const venueNames = { ttl: 'ToTheLimitGym', bf: 'Basic Fit', home: 'Home', hotel: 'Hotel', other: 'Other' };
        const sessionNames = { 'upper-a': 'Upper A', 'lower-a': 'Lower A', 'upper-b': 'Upper B', 'upper-c': 'Upper C', 'lower-b': 'Lower B' };

            state.equipment.set(venue + '|' + exerciseKey, equipmentId);
            closeSheet(); render();
            const article = document.querySelector('[data-exercise="' + exerciseKey + '"]');
            if (article) article.scrollIntoView({ block: 'center' });
        }
        document.addEventListener('input', event => {
            if (event.target.dataset.note !== undefined) {
                const item = configuration()[Number(event.target.dataset.note)], equipment = selectedEquipment(item);
                state.notes.set(state.session + '|' + state.venue + '|' + item.key + '|' + equipment.id, event.target.value); saveReview(); return;
            }
            const field = event.target.dataset.field;
            if (!field) return;
            const index = Number(event.target.dataset.index), setIndex = Number(event.target.dataset.set), item = configuration()[index];
            const entry = draftFor(item)[setIndex];
            entry[field] = event.target.value;
            if (entry.done) {
                entry.done = false;
                const button = document.querySelector('[data-action="complete"][data-index="' + index + '"][data-set="' + setIndex + '"]');
                button.classList.remove('active'); button.setAttribute('aria-pressed', 'false'); updateFooter();
            }
            document.getElementById('error-' + index + '-' + setIndex).textContent = '';
            const hint = document.querySelector('[data-exercise="' + item.key + '"] .guidance');
            if (hint) hint.textContent = guidanceFor(item, selectedEquipment(item));
            saveReview();
        });
        document.addEventListener('change', event => {
            if (event.target.id === 'workout-date') { state.dateISO = event.target.value || todayISO(); state.draftDates.set(state.session + '|' + state.venue, state.dateISO); saveReview(); }
            if (event.target.id === 'backup-file' && event.target.files[0]) importBackup(event.target.files[0]);
            if (event.target.id === 'session') selectWorkout(event.target.value, state.venue);
            if (event.target.id === 'venue') selectWorkout(state.session, event.target.value);
            if (event.target.name === 'equipment') {
                document.getElementById('new-equipment-fields').hidden = event.target.value !== 'new';
                const item = configuration()[Number(document.getElementById('equipment-form').dataset.index)];
                const equipment = state.custom.get(event.target.value) || (equipmentCatalog[item.key] || []).find(option => option.id === event.target.value) || selectedEquipment(item);
                document.getElementById('load-unit').innerHTML = loadOptionHTML(event.target.value === 'new' ? { kind: 'Unidentified setup' } : equipment, event.target.value === 'new' || !loadConfirmed(equipment) ? 'unconfirmed' : equipment.unit);
            }
        });
        document.addEventListener('submit', event => { if (event.target.id === 'equipment-form') { event.preventDefault(); applyEquipment(event.target); } if (event.target.id === 'replacement-form') { event.preventDefault(); applyCustomExercise(event.target); } });
        document.addEventListener('click', async event => {
            const button = event.target.closest('[data-action]'); if (!button) return;
            const action = button.dataset.action, index = Number(button.dataset.index), setIndex = Number(button.dataset.set);
            if (action === 'reload-app') location.reload();
            if (action === 'history') showHistory(index);
            if (action === 'backups') showBackups();
            if (action === 'export-review') exportReview();
            if (action === 'import-review') document.getElementById('backup-file').click();
            if (action === 'rollback-review') rollbackReview();
            if (action === 'map-history') mapHistory(index, button.dataset.record);
            if (action === 'equipment') showEquipment(index);
            if (action === 'pair') { const item = configuration()[index]; state.pairs.set(state.session + '|' + state.venue + '|' + item.group, item.key); render(); }
            if (action === 'unavailable') showUnavailable(index);
            if (action === 'custom-exercise') showCustomExercise(index);
            if (action === 'substitute') changeExercise(index, button.dataset.exercise);
            if (action === 'skip-exercise') changeExercise(index, 'skip');
            if (action === 'restore-exercise') changeExercise(index, 'restore');
            if (action === 'complete') completeSet(index, setIndex);
            if (action === 'add-set') { draftFor(configuration()[index]).push({ weight: '', reps: '', rir: '', done: false }); render(); }
            if (action === 'remove-set') { const draft = draftFor(configuration()[index]), last = draft[draft.length - 1]; if (entryHasValues(last)) { if (!(await confirmAction('Remove this set?', 'The last set and its entered values will be removed.', 'Remove set'))) return; } draft.pop(); render(); }
            if (action === 'close-sheet') closeSheet();
            if (action === 'confirm-sheet') closeSheet(true);
            if (action === 'pause-timer') toggleTimer();
            if (action === 'close-timer') stopTimer();
            if (action === 'finish') finish();
            if (action === 'finish-confirm') finishSample();
            if (action === 'review-draft') reviewDraft(button.dataset.draft);
            if (action === 'reset-preview') { if (state.archive) { toast('Imported history is protected. Use a full backup and rollback instead.'); return; } if ((hasAnyDraftEntries() || state.history.size || state.custom.size || state.equipment.size) && !(await confirmAction('Reset demo entries?', 'Demo drafts and demo workout history will be cleared.', 'Reset'))) return; state.drafts.clear(); state.draftItems.clear(); state.equipment.clear(); state.custom.clear(); state.customExercises.clear(); state.history.clear(); state.pairs.clear(); state.substitutions.clear(); state.skipped.clear(); state.notes.clear(); state.workouts = []; state.sampleSessions = 0; stopTimer(); render(); toast('Demo entries reset.'); }
        });
        sheet.addEventListener('cancel', () => { if (sheetResolution) { const resolve = sheetResolution; sheetResolution = null; resolve(false); } });
        let resizeTimeout;
        window.addEventListener('resize', () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { if (sheet.open && document.getElementById('history-chart')) { const title = document.getElementById('sheet-title').textContent; const item = configuration().find(candidate => title === candidate.name + ' history'); if (item) drawHistory(historyFor(selectedEquipment(item)), selectedEquipment(item)); } }, 100); });
        // The app stays suspended overnight on iOS: drop stale idle dates whenever it returns to the foreground.
        document.addEventListener('visibilitychange', () => { if (!document.hidden && persistence.ready && pruneIdleDraftDates()) { render(); saveReview(); } });
        if (typeof indexedDB === 'undefined') render();
        else startReviewStorage();
        if (typeof navigator !== 'undefined' && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && location.protocol !== 'file:') {
            // A new version installs in the background; offer a reload rather than interrupting a workout.
            const hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) document.getElementById('update-bar').hidden = false; });
            navigator.serviceWorker.register('sw.js').then(registration => {
                document.addEventListener('visibilitychange', () => { if (!document.hidden) registration.update().catch(() => { }); });
            }).catch(error => console.error('Offline cache unavailable:', error.message));
        }
    </script>
</body>
